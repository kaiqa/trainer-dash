services:
  # Test database (using SQLite for speed, or MySQL for integration tests)
  test-db:
    image: mysql:8.0
    container_name: training-dash-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: test_root_password
      MYSQL_DATABASE: meetings_test_db
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
    tmpfs:
      - /var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    networks:
      - training-dash-test-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Test runner
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: training-dash-test
    environment:
      - APP_ENV=test
      - DATABASE_URL=mysql+pymysql://test_user:test_password@test-db:3306/meetings_test_db
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=5687
      - WEBHOOK_PATH=/webhook/req-meeting
      - LOG_LEVEL=DEBUG
    depends_on:
      test-db:
        condition: service_healthy
    networks:
      - training-dash-test-network
    command: >
      sh -c "pip install -r requirements-test.txt &&
             pytest tests/ -v --tb=short --cov=app --cov-report=term-missing"
    volumes:
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro

networks:
  training-dash-test-network:
    driver: bridge